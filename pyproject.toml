[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citation-index-api-client"
version = "0.4.2"
description = "Python client for the Citation Index API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]
# The Streamlit front-end stays an optional extra.
app = [
    "streamlit>=1.66.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/citation_index_api_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
